services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linkedin_search
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d linkedin_search"]
      interval: 5s
      timeout: 5s
      retries: 10
  elasticsearch:
    # Official Elastic-maintained Docker Hub image; Docker Hub mirrors can serve it in Iran.
    image: elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: ["elasticsearch_data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/linkedin_search
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATA_FILE_PATH: /app/data/linkedin.txt
      PORT: 3001
    ports: ["3003:3001"]
    volumes: ["./300 user linkedin.txt:/app/data/linkedin.txt:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3003
    ports: ["3002:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  elasticsearch_data:
